[package]
name = "service"
version = "0.1.0"
edition = "2024"

[dependencies]
async-trait = "0.1.92"
axum = "0.8.9"
bson = { version = "3.1", features = ["chrono-0_4", "serde", "serde_json-1"] }
bytes = "1"
chrono = { version = "0.4.45", default-features = false, features = ["serde", "clock"] }
dotenvy = "0.15"
futures = "0.3.34"
google-cloud-auth = { version = "1.9", default-features = false }
google-cloud-gax = { version = "1.15", default-features = false }
google-cloud-storage = { version = "1.20", default-features = false }
google-cloud-tasks-v2 = { version = "1.13", default-features = false }
google-cloud-wkt = { version = "1.9", default-features = false }
jsonwebtoken = { version = "11.1", default-features = false, features = ["rust_crypto"] }
mongodb = { version = "3.9.1", default-features = false, features = [
    "bson-3",
    "compat-3-3-0",
    "rustls-tls",
    "dns-resolver",
] }
opentelemetry = "0.32"
opentelemetry-gcloud-trace = { version = "0.27", default-features = false, features = [
    "tls-webpki-roots",
] }
opentelemetry_sdk = "0.32"
redis = { version = "1.7.1", features = ["aio", "tokio-comp"] }
reqwest = { version = "0.13.5", default-features = false, features = [
    "http2",
    "json",
    "rustls-no-provider",
] }
reqwest-middleware = { version = "0.5.2", features = ["json", "query"] }
reqwest-tracing = { version = "0.7.1", features = ["opentelemetry_0_32"] }
rmp-serde = "1.3.1"
rustls = { version = "0.23.45", default-features = false, features = [
    "logging",
    "ring",
    "std",
    "tls12",
] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["full"] }
tower-http = { version = "0.7.1", features = ["cors", "compression-gzip", "decompression-gzip"] }
tracing = "0.1"
tracing-opentelemetry = "0.33"
tracing-subscriber = { version = "0.3", features = ["json", "fmt", "env-filter"] }
uuid = { version = "1.28", features = ["v7"] }
validator = { version = "0.21", features = ["derive"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"

[profile.release]
lto = "thin"
opt-level = 3
strip = true
codegen-units = 16

[profile.dev]
opt-level = 0
debug = true
incremental = true
