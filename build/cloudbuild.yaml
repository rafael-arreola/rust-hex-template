# La suite de tests corre dentro de build/Dockerfile (etapa builder), asi que
# este paso falla y aborta el deploy si algun test esta en rojo. El gate
# completo de calidad (fmt, clippy, sort, audit) vive en .github/workflows/ci.yml.
steps:
  - id: "Building container image"
    name: "gcr.io/cloud-builders/docker"
    entrypoint: "bash"
    args:
      - -c
      - |
        docker buildx create --use &&
        docker buildx build \
          --cache-from=type=registry,ref=us-docker.pkg.dev/$PROJECT_ID/artifacts/$_CACHE:cache \
          --cache-to=type=registry,ref=us-docker.pkg.dev/$PROJECT_ID/artifacts/$_CACHE:cache,mode=max \
          --push \
          -t us-docker.pkg.dev/$PROJECT_ID/artifacts/$_SERVICE_NAME:$COMMIT_SHA \
          -f build/Dockerfile .

  # 2. Deploy to Cloud Run
  - id: "deploy-service"
    name: "gcr.io/cloud-builders/gcloud"
    args:
      - "run"
      - "deploy"
      - "$_SERVICE_NAME"
      - "--image=us-docker.pkg.dev/$PROJECT_ID/artifacts/$_SERVICE_NAME:$COMMIT_SHA"
      - "--service-account=$SERVICE_ACCOUNT_EMAIL"
      - "--region=$_REGION"
      - "--platform=managed"
      - "--allow-unauthenticated"
      - "--cpu-boost"
      # Una sola bandera con todas las variables: `--set-env-vars` REEMPLAZA el
      # conjunto completo en cada aparicion, asi que repetirla descarta las
      # anteriores. Separado en dos lineas, SERVICE_NAME nunca llegaba al
      # contenedor y el servicio abortaba al arrancar (require_env).
      - "--set-env-vars=SERVICE_NAME=$_SERVICE_NAME,PROJECT_ID=$PROJECT_ID,APP_ENV=$_APP_ENV"
      # Configure sus secretos y envs adicionales manualmente o vía sustituciones

substitutions:
  _APP_ENV: "PRD"
  _REGION: "us-central1"

options:
  machineType: E2_HIGHCPU_32
  logging: CLOUD_LOGGING_ONLY
